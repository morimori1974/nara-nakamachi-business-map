<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>奈良市中町周辺 事業所マップ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  :root {
    --brand-industry: #8B5E3C;
    --brand-shop: #1976D2;
    --brand-hospital: #D32F2F;
    --brand-care: #7B1FA2;
    --bg: #f5f6f8;
    --panel-bg: #ffffff;
    --border: #e0e0e0;
    --text: #222;
    --text-muted: #666;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif; color: var(--text); background: var(--bg); }
  #app { display: flex; height: 100vh; }
  #sidebar {
    width: 340px; min-width: 340px; background: var(--panel-bg); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden; z-index: 10;
  }
  #sidebar h1 { font-size: 16px; margin: 16px 16px 4px; }
  #sidebar .sub { font-size: 11px; color: var(--text-muted); margin: 0 16px 12px; line-height: 1.5; }
  #search-box { margin: 0 16px 10px; }
  #search-box input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
  }
  .cat-list { padding: 0 16px; }
  .cat-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; cursor: pointer;
  }
  .cat-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .cat-item .cat-name { flex: 1; }
  .cat-item .cat-count { color: var(--text-muted); font-size: 12px; }
  #list { flex: 1; overflow-y: auto; padding: 4px 0 16px; }
  .item-card {
    margin: 6px 16px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    background: #fff; transition: box-shadow .15s, border-color .15s;
  }
  .item-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); border-color: #ccc; }
  .item-card .name { font-weight: 600; font-size: 13px; margin-bottom: 2px; }
  .item-card .addr { font-size: 11.5px; color: var(--text-muted); }
  .item-card .badge {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 10px; color: #fff; margin-bottom: 4px;
  }
  #map { flex: 1; }
  .leaflet-popup-content { font-size: 13px; line-height: 1.6; min-width: 220px; }
  .leaflet-popup-content .p-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .leaflet-popup-content .p-badge {
    display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 10px; color: #fff; margin-bottom: 6px;
  }
  .leaflet-popup-content .p-row { margin: 3px 0; }
  .leaflet-popup-content .p-label { color: var(--text-muted); font-size: 11px; }
  .leaflet-popup-content a { color: #1976D2; word-break: break-all; }
  #empty-msg { padding: 24px 16px; color: var(--text-muted); font-size: 12px; text-align: center; display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1c1e; --panel-bg: #232427; --border: #35363a; --text: #eee; --text-muted: #9aa0a6;
    }
    :root:not([data-theme="light"]) .item-card { background: #232427; }
    :root:not([data-theme="light"]) #search-box input { background: #2a2b2e; color: #eee; }
  }
  :root[data-theme="dark"] {
    --bg: #1b1c1e; --panel-bg: #232427; --border: #35363a; --text: #eee; --text-muted: #9aa0a6;
  }
  :root[data-theme="dark"] .item-card { background: #232427; }
  :root[data-theme="dark"] #search-box input { background: #2a2b2e; color: #eee; }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <h1>奈良市中町周辺 事業所マップ</h1>
    <p class="sub" id="sub-desc">奈良県奈良市中町5066-1 を中心とする半径4km圏内の中小企業・工場／店舗／病院／老人ホーム・介護施設。マーカーまたは左のリストをクリックすると詳細を表示します。</p>
    <div id="search-box"><input type="text" id="search-input" placeholder="事業所名・住所で検索..." /></div>
    <div class="cat-list" id="cat-list"></div>
    <div id="list"></div>
    <div id="empty-msg">該当する事業所がありません</div>
  </div>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(async function () {
  const res = await fetch('data.json');
  const data = await res.json();
  const CENTER = data.center;
  const CATS = data.categories;
  let features = data.features;

  const map = L.map('map', { zoomControl: true }).setView([CENTER.lat, CENTER.lng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  // center marker
  const centerIcon = L.divIcon({
    className: '', html: '<div style="width:16px;height:16px;border-radius:50%;background:#111;border:3px solid #fff;box-shadow:0 0 0 2px #111;"></div>',
    iconSize: [16,16], iconAnchor: [8,8]
  });
  L.marker([CENTER.lat, CENTER.lng], { icon: centerIcon }).addTo(map)
    .bindPopup('<b>中心地点</b><br>奈良市中町5066-1');
  L.circle([CENTER.lat, CENTER.lng], { radius: (data.radius_km || 4) * 1000, color: '#111', weight: 1.5, fill: false, dashArray: '4,6' }).addTo(map);
  document.getElementById('sub-desc').textContent =
    `奈良県奈良市中町5066-1 を中心とする半径${data.radius_km || 4}km圏内の中小企業・工場／店舗／病院／老人ホーム・介護施設 計${data.features.length}件。マーカーまたは左のリストをクリックすると詳細を表示します。`;

  const activeCats = new Set(Object.keys(CATS));
  let searchTerm = '';
  const markerLayer = L.layerGroup().addTo(map);
  const markersByIndex = [];

  function makeIcon(color) {
    return L.divIcon({
      className: '',
      html: `<div style="width:14px;height:14px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:${color};border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);"></div>`,
      iconSize: [14,14], iconAnchor: [7,14], popupAnchor: [0,-14]
    });
  }
  const icons = {};
  for (const c in CATS) icons[c] = makeIcon(CATS[c].color);

  function popupHtml(f) {
    const hp = (f.hp && f.hp !== '－') ? `<a href="${f.hp}" target="_blank" rel="noopener">${f.hp}</a>` : '－';
    return `
      <div class="p-badge" style="background:${CATS[f.category].color}">${f.category}</div>
      <div class="p-name">${f.name}</div>
      <div class="p-row"><span class="p-label">住所：</span>${f.addr}</div>
      <div class="p-row"><span class="p-label">事業内容：</span>${f.biz || '－'}</div>
      <div class="p-row"><span class="p-label">HP：</span>${hp}</div>
      <div class="p-row"><span class="p-label">中心からの距離：</span>${f.dist_km} km</div>
      <div class="p-row"><span class="p-label">出典：</span>${f.src}</div>
    `;
  }

  function matches(f) {
    if (!activeCats.has(f.category)) return false;
    if (searchTerm && !(f.name.includes(searchTerm) || f.addr.includes(searchTerm) || (f.biz||'').includes(searchTerm))) return false;
    return true;
  }

  function render() {
    markerLayer.clearLayers();
    const listEl = document.getElementById('list');
    listEl.innerHTML = '';
    let count = 0;
    features.forEach((f, i) => {
      if (!matches(f)) return;
      count++;
      const m = L.marker([f.lat, f.lng], { icon: icons[f.category] });
      m.bindPopup(popupHtml(f));
      m.addTo(markerLayer);
      markersByIndex[i] = m;

      const card = document.createElement('div');
      card.className = 'item-card';
      card.innerHTML = `<div class="badge" style="background:${CATS[f.category].color}">${f.category}</div>
        <div class="name">${f.name}</div>
        <div class="addr">${f.addr}（${f.dist_km}km）</div>`;
      card.onclick = () => {
        map.setView([f.lat, f.lng], 17, { animate: true });
        m.openPopup();
      };
      listEl.appendChild(card);
    });
    document.getElementById('empty-msg').style.display = count === 0 ? 'block' : 'none';
  }

  function renderCatList() {
    const el = document.getElementById('cat-list');
    el.innerHTML = '';
    for (const c in CATS) {
      const n = features.filter(f => f.category === c).length;
      const row = document.createElement('label');
      row.className = 'cat-item';
      row.innerHTML = `<input type="checkbox" checked data-cat="${c}" style="margin:0;">
        <span class="cat-dot" style="background:${CATS[c].color}"></span>
        <span class="cat-name">${c}</span>
        <span class="cat-count">${n}</span>`;
      row.querySelector('input').addEventListener('change', (e) => {
        if (e.target.checked) activeCats.add(c); else activeCats.delete(c);
        render();
      });
      el.appendChild(row);
    }
  }

  document.getElementById('search-input').addEventListener('input', (e) => {
    searchTerm = e.target.value.trim();
    render();
  });

  renderCatList();
  render();
})();
</script>
</body>
</html>
